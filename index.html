<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Professional CBT mock test environment, rigorous evaluation engine, and performance analytics for JEE Main &amp; Advanced aspirants." />
    <meta property="og:title" content="JEE Pressure Lab - Mock Test &amp; Performance Analytics" />
    <meta property="og:description" content="Professional CBT mock test environment, rigorous evaluation engine, and performance analytics for JEE Main &amp; Advanced aspirants." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return _currentFetch;
              },
              set: function(val) {
                _currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e2) {}
        }

        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1)
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
